<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radial blue gradient matching the authentic RSI logo -->
    <radialGradient id="rsiBlue" cx="45%" cy="45%" r="55%" fx="40%" fy="40%">
      <stop offset="0%" stop-color="#1434cb" />
      <stop offset="65%" stop-color="#0a219e" />
      <stop offset="100%" stop-color="#051566" />
    </radialGradient>
    <!-- Metallic/white gradient for text -->
    <linearGradient id="rsiWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f3fa" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Black Boundary -->
  <rect width="512" height="512" fill="transparent" />

  <!-- Outer Circle with White Rim -->
  <circle cx="256" cy="256" r="240" fill="url(#rsiBlue)" stroke="#ffffff" stroke-width="8" filter="url(#subtleGlow)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.6" />

  <!-- Monogram RSI Graphics matching the uploaded emblem -->
  <g fill="none" stroke="url(#rsiWhite)" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)">
    <!-- Main 'R' Structure -->
    <!-- Left vertical spine of R -->
    <path d="M 160 135 L 160 380" stroke-width="38" />
    
    <!-- Top horizontal of R -->
    <path d="M 160 144 L 295 144 C 355 144 385 185 385 240 C 385 290 350 330 295 330 L 160 330" stroke-width="36" />
    
    <!-- Curved sweeping leg of R and integration -->
    <path d="M 285 315 C 330 330 355 375 355 425" stroke-width="36" />

    <!-- 'I' Column on the right with rounded pill caps -->
    <path d="M 405 280 L 405 425" stroke-width="34" stroke-linecap="round" />
  </g>

  <!-- Inner 'S' Character nestled securely inside the R monogram -->
  <g fill="none" stroke="url(#rsiWhite)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 270 295 C 240 280 200 295 200 325 C 200 355 275 355 275 385 C 275 420 220 425 185 405" />
  </g>

  <!-- Outer subtle circular highlight -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
</svg>
